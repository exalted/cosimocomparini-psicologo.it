<script>
  (function (doc, tag, id) {
    if (doc.getElementById(id)) {
      return;
    }
    var js = doc.createElement(tag);
    js.id = id;
    js.src = "/assets/vendor/psicologi-italia.it/psi-widget-modified.js";
    js.type = "text/javascript";
    js.onload = function () {
      createWidget("desktop");
      createWidget("mobile");
      // Give the widget iframes an accessible name (a11y: frame-title).
      ["desktop", "mobile"].forEach(function (variant) {
        var frame = document.getElementById("WidgetFrameId_" + variant);
        if (frame) {
          frame.title = "Badge di verifica Psicologi-Italia.it";
        }
      });
    };
    doc.body.appendChild(js);
  })(document, "script", "psi-widget-script");
</script>
